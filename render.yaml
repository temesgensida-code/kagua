services:
  # 1. SWI-Prolog Reasoner Engine
  - type: web
    name: kagua-reasoner
    runtime: docker
    dockerContext: reasoner-engine
    dockerfilePath: reasoner-engine/Dockerfile
    envVars:
      - key: PORT
        value: 8081
    plan: free

  # 2. Python Legal Parser & RAG Engine
  - type: web
    name: kagua-parser
    runtime: docker
    dockerContext: parser
    dockerfilePath: parser/Dockerfile
    envVars:
      - key: PORT
        value: 8001
    plan: free

  # 3. Rust Core Backend API
  - type: web
    name: kagua-core-be
    runtime: docker
    dockerContext: core-be
    dockerfilePath: core-be/Dockerfile
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: kagua-db
          property: connectionString
      - key: REASONER_URL
        value: http://kagua-reasoner:8081
      - key: PARSER_URL
        value: http://kagua-parser:8001
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: "*"
    plan: free

databases:
  # Managed PostgreSQL Database
  - name: kagua-db
    databaseName: kagua
    user: kagua_user
    plan: free
