services:
  # 1. SWI-Prolog Reasoner Engine
  - type: web
    name: kagua-reasoner
    runtime: docker
    dockerContext: .
    dockerfilePath: reasoner-engine/Dockerfile
    envVars:
      - key: PORT
        value: 8081
    plan: free

  # 2. Python Legal Parser & RAG Engine
  - type: web
    name: kagua-parser
    runtime: docker
    dockerContext: .
    dockerfilePath: parser/Dockerfile
    envVars:
      - key: PORT
        value: 8001
    plan: free

  # 3. Rust Core Backend API
  - type: web
    name: kagua-core-be
    runtime: docker
    dockerContext: .
    dockerfilePath: core-be/Dockerfile
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: kagua-db
          property: connectionString
      - key: REASONER_URL
        value: http://kagua-reasoner:8081
      - key: PARSER_URL
        value: http://kagua-parser:8001
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: "https://kagua.temesgen.works"
      - key: RESEND_API_KEY
        sync: false
      - key: FROM_EMAIL
        value: "noreply@kagua.temesgen.works"
      - key: FROM_NAME
        value: "Kagua Compliance"
    plan: free

databases:
  - name: kagua-db
    databaseName: kagua
    user: kagua_user
    plan: free
